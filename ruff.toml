# Ruff configuration
# https://docs.astral.sh/ruff/configuration/

target-version = "py311"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "C901", # mccabe complexity
    "PLR",  # pylint refactor
]

ignore = [
    "S101",    # assert used (OK in tests)
    "PLR0913", # too many arguments (sometimes necessary)
    "PLR2004", # magic value comparisons — intentional in assertions and thresholds
    "S608",    # SQL injection false positive — f-strings for column names, values are parameterized (?)
    "E402",    # module-level import not at top — intentional after logger/config setup
    "E741",    # ambiguous variable name — single-letter vars in list comprehensions
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "PLR2004", "E501", "SIM115", "B017", "SIM117", "SIM108", "F841"]
# CLI dispatch grows with subcommands; subprocess calls use controlled internal inputs
# E501: click option help strings are intentionally long single-line strings
"src/lessons_db/cli.py" = ["C901", "PLR0912", "PLR0915", "S603", "S607", "B904", "SIM108", "SIM105", "S110", "E501"]
# Prompt strings are long by design — LLM instructions require full context in one string
"src/lessons_db/capture.py" = ["E501"]
# Pattern extraction uses controlled git/semgrep commands, not user input
"src/lessons_db/pattern_extract.py" = ["C901", "PLR0912", "S603", "S607", "SIM105", "S110", "B905"]
# Semgrep scanner uses controlled binary paths
"src/lessons_db/scan.py" = ["S603", "S607"]
# search_combined is deliberately complex — multi-strategy search (semantic + keyword + file + content)
"src/lessons_db/search.py" = ["C901"]
# zip() strict= not needed for paired enumerate results
"src/lessons_db/cluster.py" = ["B905"]
"src/lessons_db/vectors.py" = ["B905"]

[lint.mccabe]
max-complexity = 10

[format]
quote-style = "double"
indent-style = "space"
